# A.B.S.O. Configuration
# Adaptive Battle Station Optimizer

backup_dir: backups
auto_backup: true
log_level: INFO
confirm_destructive: true

# DDC/CI — enabled for this PC (CVTE controller on LG 27GS95QE)
ddci:
  enabled: true
  controller_override: CVTE

# NOTE (2026-06-09): this file used to force `graphics.disable_mpo: true` on
# both Overwatch 2 G-SYNC HDR lanes via profile_overrides. That override
# predated the profiles' move to the optimized borderless/windowed VRR path
# (which declares disable_mpo: false) and silently won over the profile on
# every apply, re-writing the MPO-disable registry values each time. The
# first reboot that committed them killed the borderless independent-flip
# path, windowed G-SYNC could no longer engage, and the driver V-SYNC
# backstop locked OW2 to exactly half refresh (150 fps on the 300 Hz panel).
# Do not re-add an MPO override here without re-validating windowed VRR;
# the applier now warns whenever a config override contradicts an explicit
# profile declaration.

# NOTE (2026-07-14): Logitech G HUB protected from the launch-time process
# sweep. The strict (non-capture-safe) gaming lanes carry lghub* in their
# always-safe killset; killing lghub_agent.exe mid-session reverted the
# mouse to onboard defaults (wrong DPI, DPI-shift buttons falling through
# to game keybinds in OW2). This machine's mouse relies on G HUB software
# profiles, so protect wins over every profile killset by design.
# Keep in sync with the installed copy at
# %LOCALAPPDATA%\AdaptiveBattleStationOptimizer\abso.yaml.
process_overrides:
  protect:
    - lghub.exe
    - lghub_agent.exe
    - lghub_updater.exe

# EXPERIMENT (2026-07-16, user-requested): no-sync HDR lane with driver LLM
# Ultra instead of the lane's stock Reflex-oriented contract (reflex_no_sync
# sets LLM off; user runs in-game Reflex OFF for this test). The applier will
# warn that the override diverges from the preset — that is intentional here.
# Evidence status: uncapped no-sync + Reflex ON is the measured-optimal config
# (klasbo OW2 suite); this override exists to let the user A/B their own
# hypothesis (uncapped + Reflex OFF + ULL Ultra) with CapFrameX.
# REMOVE this block when the experiment concludes — see the 2026-06-09 MPO
# note above for why stale profile_overrides are dangerous.
profile_overrides:
  overwatch2-hdr:
    nvidia:
      low_latency_mode: ultra
    ow2_config:
      # Track the user's intended in-game Reflex state (Off) for this
      # experiment so verify's manual step reflects the test config.
      expected_reflex_mode: 0
