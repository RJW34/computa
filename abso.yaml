# A.B.S.O. Configuration
# Adaptive Battle Station Optimizer

backup_dir: backups
auto_backup: true
log_level: INFO
confirm_destructive: true

# DDC/CI — enabled for this PC (CVTE controller on LG 27GS95QE)
ddci:
  enabled: true
  controller_override: CVTE

# Local stability override for this mixed-refresh HDR/G-SYNC desktop.
# Both Overwatch HDR G-SYNC lanes intentionally use the windowed VRR path on
# this PC; keep the same MPO mitigation on the overlay-free and capture-safe
# variants so switching profiles does not try to undo the compositor fix.
# Disabling MPO is reboot-gated and should be applied once.
profile_overrides:
  overwatch2-gsync-hdr:
    graphics:
      disable_mpo: true
  overwatch2-gsync-hdr-capture:
    graphics:
      disable_mpo: true
