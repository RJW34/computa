# A.B.S.O. Configuration
# Adaptive Battle Station Optimizer

backup_dir: backups
auto_backup: true
log_level: INFO
confirm_destructive: true

# DDC/CI — enabled for this PC (CVTE controller on LG 27GS95QE)
ddci:
  enabled: true
  controller_override: CVTE

# Local stability override for this mixed-refresh HDR/G-SYNC desktop.
# The active Overwatch capture-safe profile intentionally uses the windowed
# VRR path, but this PC has shown secondary-monitor black flashes with MPO
# left enabled. Disabling MPO is reboot-gated and should be applied once.
profile_overrides:
  overwatch2-gsync-hdr-capture:
    graphics:
      disable_mpo: true
