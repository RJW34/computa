[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abso"
version = "1.0.0"
description = "Adaptive Battle Station Optimizer - Windows 11 gaming optimization CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RJW34"}
]
keywords = ["gaming", "optimization", "windows", "nvidia", "latency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

dependencies = [
    "wmi>=1.5.1",
    "pywin32>=306",
    "pynvml>=11.5.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
abso = "abso.main:cli"

[project.urls]
Homepage = "https://github.com/RJW34/A.B.S.O."
Repository = "https://github.com/RJW34/A.B.S.O."
Issues = "https://github.com/RJW34/A.B.S.O./issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["abso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that exercise real or simulated end-to-end system flows",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | __pycache__
    | \.pytest_cache
    | \.pytest-runtime
    | \.pytest-tmp
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "tests",
]

[[tool.mypy.overrides]]
module = [
    "wmi",
    "pynvml",
    "win32api",
    "win32con",
    "win32gui",
    "win32process",
    "pywintypes",
    "ctypes.wintypes",
    "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["abso"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

